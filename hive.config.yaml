# Hive Configuration for dostal-3d-printing
# All settings have sensible defaults. Override only what you need.

schema_version: "1.2"

paths:
  state_dir: .pHive
  target_project: null
  gate_mode: warning

# Opted in at kickoff (2026-09-08) to unlock metric-driven meta-optimization
# once real usage/token signal exists.
metrics:
  enabled: true

quality_gates:
  auto_pass_threshold: 0.9
  human_escalation_threshold: 0.3

tokens:
  per_task_limit: 100000
  per_story_limit: 500000
  per_epic_limit: 2000000
  warning_threshold: 0.8

task_tracking:
  adapter: github
  team_value: mdostal
  project_value: dt-forge
  github:
    token: null

execution:
  default_methodology: classic
  parallel_teams: true
  max_retry_attempts: 2

planning:
  collaborative_review: true

meta_team:
  github_forwarding: false

developer:
  pr_style: single-commit
  commit_granularity: feature-scoped
  review_depth: standard
  notes: null

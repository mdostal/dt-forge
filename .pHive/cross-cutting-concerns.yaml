concerns:
  - id: documentation
    name: Documentation Updates
    description: >
      When a story changes user-facing behavior, workflow steps, or configuration,
      corresponding documentation must be updated.
    applies_when: >
      Story modifies workflows, schemas, directory structure, configuration files,
      or adds/removes/renames reference documents
    planning_prompt: >
      Which documentation files reference the behavior this story changes?
      List each doc and what section needs updating.
    implementation_checklist:
      - "All docs referencing changed behavior identified"
      - "Affected sections updated to reflect new behavior"
      - "No stale references to old behavior remain"
  - id: model-licensing
    name: Model Licensing Integrity
    description: >
      Any story that adds, generates, or ingests a 3D model file must not let
      MODELS.md drift from the actual license/status of the file on disk.
    applies_when: >
      Story adds model ingestion, generation, or import tooling; story touches
      raws/, sliced/, or an owned/ folder; story adds automation that writes to
      MODELS.md.
    planning_prompt: >
      Does this story create or move model files? If so, how does MODELS.md get
      updated (source, creator, license, status) in the same change?
    implementation_checklist:
      - "MODELS.md entry added/updated for any new or moved model file"
      - "Personal-print-only files stay out of git (not added to owned/ by mistake)"
      - "License field is never left blank for a newly tracked model"
